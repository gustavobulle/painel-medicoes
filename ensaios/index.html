<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Painel Ensaios AFIRMA · acesso restrito</title>
<style>
:root{--bg:#f6f4ee;--ink:#14232e;--mut:#5b6b77;--line:#dad6ca;--acc:#1f6f8b;--warn:#b24a17;--card:#fcfbf7}
@media (prefers-color-scheme:dark){:root{--bg:#10191f;--ink:#e8eef2;--mut:#93a4b0;--line:#2a3944;--acc:#59b3cf;--warn:#f0946a;--card:#16232b}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
main{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
h1{font-family:Georgia,serif;font-size:24px;line-height:1.2;margin:0 0 6px}
p{margin:0 0 20px;color:var(--mut);font-size:14.5px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0b1419}}
button[disabled]{opacity:.6;cursor:wait}
#msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--warn)}
</style></head><body>
<main>
<h1>Painel Ensaios AFIRMA</h1>
<p>Acesso restrito. Digite a senha para abrir o painel.</p>

<button id="b" type="submit">Abrir painel</button>
<div id="msg" role="alert" aria-live="polite"></div>
</form>
</main>

async function gunzip(buf){

  const r=new Response(new Blob([buf]).stream().pipeThrough(ds));
  return await r.text();
}
